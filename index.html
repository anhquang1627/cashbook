<!doctype html><html lang="en-CA"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Quang's Cashbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: sticky ledger bar, four figures first, one wide chart with the findings beside it; wishlist verdicts print as receipts. */
:root{
  --bg:#edf0f5;--surface:#fbfcfd;--sunk:#f2f4f8;--ink:#10141c;--ink2:#465064;--muted:#6c7586;--line:#dce1e9;--line2:#c3cad6;
  --accent:#1f63b8;--on-accent:#ffffff;--wash:#e2ecfa;--shadow:rgba(16,20,28,.14);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--band:rgba(42,120,214,.13);
  --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;--good-ink:#006300;--warn-ink:#7a5200;--crit-ink:#a52222;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f14;--surface:#161a21;--sunk:#11151b;--ink:#eceff4;--ink2:#b7bfcc;--muted:#8791a3;--line:#262c37;--line2:#3a4353;
  --accent:#3987e5;--on-accent:#071222;--wash:#16283f;--shadow:rgba(0,0,0,.5);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--band:rgba(57,135,229,.18);
  --good-ink:#3fc23f;--warn-ink:#fab219;--crit-ink:#f08080;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0f14;--surface:#161a21;--sunk:#11151b;--ink:#eceff4;--ink2:#b7bfcc;--muted:#8791a3;--line:#262c37;--line2:#3a4353;
  --accent:#3987e5;--on-accent:#071222;--wash:#16283f;--shadow:rgba(0,0,0,.5);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--band:rgba(57,135,229,.18);
  --good-ink:#3fc23f;--warn-ink:#fab219;--crit-ink:#f08080;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ul,dl,dd,figure{margin:0}ul{padding:0;list-style:none}
h2{font:700 19px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font:800 22px/1 var(--f-display);letter-spacing:-.02em}
.brand span{font:500 11px var(--f-num);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
nav a{padding:6px 12px;border-radius:6px;color:var(--ink2);text-decoration:none;font-weight:600;white-space:nowrap}
nav a:hover{background:var(--sunk)}
nav a[aria-current]{background:var(--ink);color:var(--surface)}
.sync{font:500 11px var(--f-num);color:var(--muted);white-space:nowrap}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line2);margin-right:6px}
.sync.ok::before{background:var(--good)}.sync.demo::before{background:var(--warn)}

main{display:grid;gap:16px;padding-block:18px 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;display:grid;gap:12px;align-content:start}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:13.5px;max-width:65ch}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.split.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:grid;gap:16px;min-width:0;align-content:start}
.banner{background:var(--wash);border:1px solid var(--line2);border-radius:10px;padding:12px 16px;display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{max-width:70ch}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile{background:var(--surface);padding:14px 16px;display:grid;gap:4px;min-width:0}
.tile .k{font:500 11px var(--f-num);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:700 clamp(24px,3.4vw,32px)/1.1 var(--f-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.tile .v small{font:500 14px var(--f-body);color:var(--muted);letter-spacing:0}
.tile .v.neg{color:var(--crit-ink)}.tile .v.pos{color:var(--good-ink)}
.tile .s{font-size:12.5px;color:var(--ink2)}
.tile.top{grid-column:1/-1;padding:16px;gap:6px}

.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{background:var(--crit);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--ink);color:var(--surface)}
input[type=text],input[type=number],input[type=date],input[type=search],select{background:var(--sunk);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink2);min-width:0}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));align-items:end}
.form .grow{grid-column:span 2}

.chart{min-height:120px;position:relative}
svg{display:block;max-width:100%}
.ax{font:11px var(--f-num);fill:var(--muted)}
.grid{stroke:var(--line);stroke-width:1}.grid.zero{stroke:var(--line2);stroke-width:1.5}
.now{stroke:var(--line2);stroke-width:1;stroke-dasharray:2 3}
.band{fill:var(--band);stroke:none}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ln.dash{stroke-dasharray:5 4}
.ln.s1{stroke:var(--s1)}.ln.s2{stroke:var(--s2)}.ln.s2.dash{stroke-dasharray:2 5}
.dot{stroke:var(--surface);stroke-width:2}.dot.s1{fill:var(--s1)}.dot.s2{fill:var(--s2)}
.cross{stroke:var(--line2);stroke-width:1}
.b2{fill:var(--s2)}.b3{fill:var(--s3)}
.selband{fill:var(--wash)}.hit{fill:transparent;cursor:pointer}
.mlab{font:600 11.5px var(--f-body);fill:var(--ink2)}.mlab.on{fill:var(--ink)}
.mnet{font:10.5px var(--f-num);fill:var(--muted)}
.lg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:10px;border-radius:2px;display:inline-block}
.lg i.l{height:0;border-top:2px solid var(--s1);border-radius:0}.lg i.l.d{border-top-style:dashed}.lg i.l.o{border-top-color:var(--s2);border-top-style:dotted}
.lg i.k2{background:var(--s2)}.lg i.k3{background:var(--s3)}.lg i.kb{background:var(--band);height:10px}
.facts{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.facts b{font:600 13px var(--f-num);color:var(--ink)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);font:12px/1.45 var(--f-num);padding:7px 9px;border-radius:6px;white-space:pre-line;max-width:260px}

.ins{display:grid;gap:14px}
.ins li{display:grid;gap:4px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ins li:last-child{border:0;padding-bottom:0}
.ins p{font-size:13.5px;color:var(--ink2)}
.ins .do{color:var(--ink)}.ins .do b{font:600 11px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.pill{justify-self:start;font:600 10.5px var(--f-num);letter-spacing:.07em;text-transform:uppercase;padding:1px 7px;border-radius:4px;border:1px solid currentColor}
.pill.crit{color:var(--crit-ink)}.pill.warn{color:var(--warn-ink)}.pill.good{color:var(--good-ink)}.pill.info{color:var(--accent)}

.list{display:grid}
.li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border:0}
.li .d{font:12px var(--f-num);color:var(--muted)}
.li .n{min-width:0;overflow-wrap:anywhere}.li .n small{display:block;color:var(--muted);font-size:12px}
.amt{font:500 13.5px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt.in{color:var(--good-ink)}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}

.hbs{display:grid;gap:2px}
.hb{display:grid;grid-template-columns:118px minmax(0,1fr) 68px;gap:10px;align-items:center;background:transparent;border:0;padding:5px 4px;border-radius:6px;text-align:left;cursor:pointer;width:100%}
.hb:hover,.hb.on{background:var(--sunk)}
.hb-l{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{position:relative;height:14px}
.hb-t i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hb-t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:500 11px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
tr:last-child td{border:0}
.chg.up{color:var(--crit-ink)}.chg.down{color:var(--good-ink)}
.spark polyline{fill:none;stroke:var(--s1);stroke-width:1.5}.spark circle{fill:var(--s1)}
.scroll{overflow-x:auto}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:190px;align-items:end}
.wk-c{display:grid;grid-template-rows:16px 1fr auto;gap:4px;height:100%;text-align:center;font-size:12px;color:var(--ink2)}
.wk-c em{font:500 11px var(--f-num);font-style:normal;color:var(--ink)}
.wk-c .bar{display:flex;align-items:flex-end;justify-content:center}
.wk-c i{display:block;width:min(100%,26px);background:var(--s1);border-radius:4px 4px 0 0;min-height:2px}
.txbar{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px;flex:1;min-width:min(100%,280px);max-width:460px}
.tx{display:grid;grid-template-columns:56px minmax(0,1fr) 150px 92px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.tx select{padding:4px 6px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.chip{background:var(--wash);border:0;border-radius:99px;padding:3px 10px;cursor:pointer;font-weight:600}

.lever{display:grid;grid-template-columns:auto minmax(120px,1fr) auto;gap:8px 14px;align-items:center;font-size:13.5px}
.lever input{accent-color:var(--accent);width:100%}
.receipts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;align-items:start}
.rw{filter:drop-shadow(0 1px 2px var(--shadow))}
.rcpt{background:var(--surface);padding:16px 16px 22px;display:grid;gap:10px;
  -webkit-mask:radial-gradient(5px at 50% 100%,#0000 97%,#000) 50%/12px 100%;mask:radial-gradient(5px at 50% 100%,#0000 97%,#000) 50%/12px 100%}
.rcpt header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rcpt h3{font:700 17px/1.2 var(--f-display);overflow-wrap:anywhere;min-width:0}
.stamp{font:600 11.5px var(--f-num);letter-spacing:.09em;text-transform:uppercase;border:2px solid currentColor;border-radius:4px;padding:2px 7px;transform:rotate(-3deg);white-space:nowrap;flex:none}
.t-good .stamp{color:var(--good-ink)}.t-warn .stamp{color:var(--warn-ink)}.t-crit .stamp{color:var(--crit-ink)}.t-info .stamp{color:var(--accent)}
.rcpt dl{display:grid;gap:3px;font:13px var(--f-num);border-block:1px dashed var(--line2);padding-block:9px}
.rcpt dl div{display:flex;align-items:baseline;gap:6px}
.rcpt dt{color:var(--ink2)}.rcpt dl span{flex:1;border-bottom:1px dotted var(--line2);min-width:12px}
.rcpt p{font-size:13.5px;color:var(--ink2)}
.rcpt .lesson{color:var(--ink)}.rcpt .lesson b{font:600 11px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.rcpt footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;font-weight:600;cursor:pointer}
.chk input{accent-color:var(--s2);width:16px;height:16px}
.tl{display:grid;gap:8px}
.tl-r{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13.5px}
.tl-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-t{height:12px;background:var(--sunk);border-radius:6px;position:relative}
.tl-t i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:6px;min-width:6px}
.tl-r.debt .tl-t i{background:var(--muted)}
.tl-d{font:12.5px var(--f-num);text-align:right;color:var(--ink2)}

.drop{display:grid;place-items:center;gap:2px;text-align:center;border:1.5px dashed var(--line2);border-radius:10px;padding:22px 14px;cursor:pointer;color:var(--ink2);background:var(--sunk)}
.drop.over,.drop:focus-within{border-color:var(--accent);background:var(--wash)}
.drop b{color:var(--ink)}
.sr{position:absolute;opacity:0;width:1px;height:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filebtn{position:relative;display:inline-block}.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.undo{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100vw - 24px);display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 10px 8px 14px;box-shadow:0 6px 24px var(--shadow);font-size:13.5px}
.undo span{min-width:0;overflow-wrap:anywhere}
.msg{font-size:13.5px;white-space:pre-line}.msg.ok{color:var(--good-ink)}.msg.bad{color:var(--crit-ink)}
.acc{display:grid;grid-template-columns:minmax(120px,1.4fr) minmax(110px,1fr) repeat(3,minmax(84px,.8fr)) auto;gap:8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.acc:last-of-type{border:0}
.steps{color:var(--ink2);font-size:13.5px;padding-left:18px;list-style:decimal;display:grid;gap:4px}.steps b{color:var(--ink);font-weight:600}
.code{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code code{font:13px var(--f-num);background:var(--sunk);border:1px solid var(--line2);border-radius:6px;padding:6px 9px;user-select:all;-webkit-user-select:all;white-space:pre;overflow-wrap:anywhere}
.big{font:700 clamp(22px,3vw,28px)/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.narrow{max-width:760px}
tr.on td{background:var(--wash)}tr.on td:first-child{box-shadow:inset 3px 0 0 var(--accent);padding-left:8px}
.bud{display:grid;gap:12px}
.bud-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13.5px;align-items:baseline}
.bud-t{grid-column:1/-1;height:10px;background:var(--sunk);border-radius:5px;position:relative}
.bud-t i{position:absolute;inset:0 auto 0 0;background:var(--s1);border-radius:5px;min-width:2px}
.bud-r.warn .bud-t i{background:var(--warn)}.bud-r.crit .bud-t i{background:var(--crit)}
.bud-t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.bud-n{grid-column:1/-1;color:var(--ink2);font-size:12.5px}
.bud-r.warn .bud-n{color:var(--warn-ink)}.bud-r.crit .bud-n{color:var(--crit-ink)}
.whatif{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px;font-size:13.5px}
.whatif .chk{font-weight:500}
.whatif .in{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.whatif .in input[type=number],.whatif .in input[type=date]{width:auto;flex:1;min-width:110px;max-width:170px}
.dr{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(130px,.8fr) minmax(0,1.3fr);gap:6px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.dr:last-child{border:0}.dr small{display:block;color:var(--muted);font-size:12px}
.rvq{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.rvq:last-child{border:0;padding-bottom:0}
.skip{position:fixed;left:8px;top:-80px;z-index:30;background:var(--ink);color:var(--surface);border:0;border-radius:6px;padding:8px 12px;font-weight:600}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
main:focus{outline:none}
.ans{display:grid;gap:4px;font:inherit;letter-spacing:0;scroll-margin-top:120px}
.ans .k{font:500 11px var(--f-num);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ans .big{justify-self:start;overflow-wrap:anywhere;border-radius:6px}
.ans .k .ex{font:inherit;color:var(--warn-ink);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:6px}
.ans .big.crit{color:var(--crit-ink)}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-align:left;cursor:pointer}
tr.on .lnk{color:var(--ink)}
td small{color:var(--muted);font-size:12px}
.sp{display:inline-block;vertical-align:middle}
.banner.bad{border-color:var(--crit)}
.sync.bad::before{background:var(--crit)}
.skel{display:grid;gap:10px}.skel i{display:block;height:14px;border-radius:7px;background:var(--sunk)}.skel i:nth-child(2){width:80%}.skel i:nth-child(3){width:55%}
.hit:focus-visible{outline:none;stroke:var(--accent);stroke-width:2}
svg.linechart{touch-action:pan-y}svg.linechart:focus-visible{outline-offset:-2px}
.fab{display:none}
dialog.sheet{border:1px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--ink);padding:16px;width:min(420px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 12px 40px var(--shadow)}
dialog.sheet::backdrop{background:rgba(10,14,20,.5)}
.qf{display:grid;gap:8px}
.qf header{display:flex;justify-content:space-between;align-items:center;gap:10px}

<script>
/*CORE*/
const DAY=864e5,pad=n=>String(n).padStart(2,'0');
const toD=s=>{const a=s.split('-');return Date.UTC(+a[0],a[1]-1,+a[2])};

const ym=s=>s.slice(0,7);
const sum=a=>a.reduce((x,y)=>x+y,0);

const nf2=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',currencyDisplay:'narrowSymbol'});
const nf0=new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',currencyDisplay:'narrowSymbol',maximumFractionDigits:0});

const money0=n=>nf0.format(Math.round(n||0)).replace('-','−').replace(/^−\$0$/,'$0');

const dfmt=(s,o)=>new Date(toD(s)).toLocaleDateString('en-US',{timeZone:'UTC',...o});
const dshort=s=>dfmt(s,{month:'short',day:'numeric'});

const pct=n=>String(+(+n).toFixed(1));
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const CATS={Income:'in',Transfer:'x','Cash withdrawal':'x',Rent:'fixed','Phone & internet':'fixed',School:'fixed',Groceries:'flex','Eating out':'flex',Transport:'flex',Shopping:'flex',Subscriptions:'flex',Fun:'flex',Health:'flex','Fees & interest':'flex','Untracked cash':'flex',Other:'flex'};
const TRIM=new Set(['Eating out','Shopping','Subscriptions','Fun','Untracked cash','Other']);
const NEED=['','Pure want','Nice to have','Useful','Need soon','Must have'];
const RULES=[
 ['Subscriptions',/SPOTIFY|NETFLIX|DISNEY|CRAVE|YOUTUBE|APPLE\.COM|GOOGLE|OPENAI|CHATGPT|CLAUDE|ANTHROPIC|AMAZON(\.CA)? ?PRIME|AMZN PRIME|PRIME VIDEO|ICLOUD|ADOBE|MICROSOFT|NOTION|PATREON|AUDIBLE|DUOLINGO|CANVA/],
 ['Eating out',/TIM HORTONS|MCDONALD|STARBUCKS|SUBWAY|PIZZA|BURGER|KFC|POPEYES|WENDY|A&W|TACO|SUSHI|\bPHO\b|RAMEN|NOODLE|RESTAURANT|CAFE|COFFEE|BUBBLE|\bTEA\b|CHATIME|UBER ?EATS|DOORDASH|SKIP ?THE|GRILL|KITCHEN|BAKERY|DINER|BBQ|SHAWARMA|WINGS|\bPUB\b|DAIRY QUEEN|DOMINO|CHIPOTLE|FIVE GUYS|HARVEY|DESSERT|MARMALADE|OSMOW|BANH MI|COCA[- ]?COLA|ESPRESSO/],
 ['Groceries',/FOOD BASICS|FRESHCO|WAL-?MART|WM SUPERC|ASIAN BASKET|NO FRILLS|\bMETRO\b|ZEHRS|SUPERSTORE|COSTCO|SOBEYS|T&T|FOODLAND|GIANT TIGER|LOBLAWS|FARM BOY|GROCER|SUPERMARKET|FOOD MARKET/],
 ['Transport',/UBER|LYFT|TRANSIT|PRESTO|VIA RAIL|GREYHOUND|FLIXBUS|PETRO|\bSHELL\b|\bESSO\b|GAS BAR|PARKING|TAXI|AIR CANADA|WESTJET|FLAIR AIR|PORTER AIR/],
 ['Phone & internet',/FIDO|ROGERS|BELL MOBILITY|BELL CANADA|TELUS|KOODO|FREEDOM MOBILE|PUBLIC MOBILE|VIRGIN PLUS|CHATR|LUCKY MOBILE|FIZZ|COGECO|INTERNET/],
 ['School',/UNIVERSITY|UWINDSOR|U OF W|TUITION|BOOKSTORE|COLLEGE/],
 ['Health',/SHOPPERS|PHARMA|REXALL|DENTAL|CLINIC|OPTICAL|GYM|FITNESS|GOODLIFE/],
 ['Fun',/CINEPLEX|STEAM|PLAYSTATION|XBOX|NINTENDO|TICKETMASTER|LCBO|BEER STORE|CASINO|BOWL/],
 ['Shopping',/AMAZON|AMZN|DOLLARAMA|CANADIAN TIRE|BEST BUY|IKEA|WINNERS|H&M|UNIQLO|ZARA|SHEIN|TEMU|ALIEXPRESS|HOME DEPOT|STAPLES|SEPHORA|MARSHALLS|OLD NAVY|SPORT CHEK|APPLE STORE|EBAY|ETSY/]
];
const isETF=D=>/E-?TFR|E-?TRANSFER|INTERAC/.test(D);
function autoCat(desc,amt,type,rent){
  const D=String(desc).toUpperCase();
  if(type==='credit'&&amt>0&&/PAYMENT|PYMT|THANK YOU/.test(D))return 'Transfer';
  if(isETF(D)){if(amt<0)return rent>0&&(Math.abs(-amt-rent)<=rent*.02||Math.abs(-amt-rent/2)<=rent*.01)?'Rent':'Other';return 'Income'}
  if(/\bATM\b|CASH WITHDRA|W\/D/.test(D))return amt<0?'Cash withdrawal':'Income';
  if(/\bFEE|\bINTEREST|\bNSF\b|OVERDRAFT|SERVICE CHARGE|REBATE/.test(D))return 'Fees & interest';
  if(type==='credit'&&/CASH ADV/.test(D))return 'Transfer';
  if(type!=='credit'&&/VISA|MASTERCARD|C\/C|PYMT|\bTFR\b|PTS (TO|FRM)|TRANSFER|LOC PAY/.test(D))return 'Transfer';
  if(amt>0&&/PAYROLL|SALARY|\bPAY\b|DIRECT DEP|\bGST\b|TAX REFUND|CANADA (FED|PRO)/.test(D))return 'Income';
  for(const r of RULES)if(r[1].test(D))return r[0];
  if(/\bRENT\b|LANDLORD|PROPERTY M/.test(D))return 'Rent';
  if(amt>0&&type!=='credit')return 'Income';
  return 'Other';
}
const mwords=s=>s.replace(/#\s*\d+/g,' ').replace(/\S*\d\S*\d\S*/g,' ').replace(/_[A-Z]\b/g,' ')
    .replace(/[^A-Z&' ]+/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(w=>w.length>1).slice(0,3).join(' ')||'UNKNOWN';
/* The merchant's name without store numbers and reference codes. "OPENAI* CH" and "OPENAI *CH" give the same key. */
function mkey(desc){return mwords(String(desc).toUpperCase().replace(/\*{2,}\S*/g,' ').replace(/\*\s*\S*\d\S*/g,' ').replace(/\*/g,' '))}
/* The key as it was first built. Category choices saved under it still apply. */
function mkey0(desc){return mwords(String(desc).toUpperCase().replace(/\*+\S*/g,' '))}
const ruleOf=(S,desc)=>S.rules[mkey(desc)]||S.rules[mkey0(desc)];
const pretty=s=>mkey(s).toLowerCase().replace(/(^|[\s&])[a-z]/g,c=>c.toUpperCase());

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  const end=()=>{row.push(cur);cur='';if(row.some(c=>c.trim()!==''))rows.push(row);row=[]};
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;end()}
    else cur+=ch}
  end();return rows;
}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(s){
  s=String(s==null?'':s).trim();let m,y,mo,d;
  if(m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/)){y=+m[1];mo=+m[2];d=+m[3]}
  else if(m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/)){y=+m[3];mo=+m[1];d=+m[2];if(mo>12&&d<=12){const t=mo;mo=d;d=t}}
  else if(m=s.match(/^([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/)){y=+m[3];mo=MON[m[1].toLowerCase()];d=+m[2]}
  else if(m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[a-z]*\.?[-\s,]+(\d{4})/)){y=+m[3];mo=MON[m[2].toLowerCase()];d=+m[1]}
  else return null;
  if(!mo||mo>12||d<1||d>31||y<1990||y>2100)return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
function num(s){s=String(s==null?'':s).trim();if(!s)return null;const neg=/^\(.*\)$/.test(s)||/^[-−]/.test(s)||/-$/.test(s);const v=parseFloat(s.replace(/[^0-9.]/g,''));return isNaN(v)?null:neg?-v:v}
function parseStatement(text,type){
  const rows=parseCSV(String(text).replace(/^﻿/,''));let hi=-1,col=null,split=false;
  for(let i=0;i<Math.min(rows.length,8);i++){if(rows[i].some(c=>parseDate(c)))break;if(rows[i].some(c=>/date/i.test(c)))hi=i}
  if(hi>=0){const h=rows[hi].map(c=>c.trim().toLowerCase()),f=(re,not)=>h.findIndex((c,i)=>re.test(c)&&i!==not);
    const d=f(/date/,-1);col={d,desc:f(/desc|merchant|detail|transaction|payee|name/,d),out:f(/withdraw|debit|paid out|charge/,d),inn:f(/deposit|credit|paid in/,d),bal:f(/balance/,d),amt:f(/amount/,d)}}
  const out=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];let c=col;
    if(!c){const di=r.findIndex(x=>parseDate(x));if(di<0)continue;const n=r.length-di;
      c=n>=5?{d:di,desc:di+1,out:di+2,inn:di+3,bal:di+4,amt:-1}:n===4?{d:di,desc:di+1,amt:di+2,bal:di+3,out:-1,inn:-1}:{d:di,desc:di+1,amt:di+2,out:-1,inn:-1,bal:-1}}
    const d=parseDate(r[c.d]);if(!d)continue;let amt;
    if(c.out>=0||c.inn>=0){split=true;const o=num(r[c.out])||0,n=num(r[c.inn])||0;if(!o&&!n)continue;amt=Math.abs(n)-Math.abs(o)}
    else{const a=num(r[c.amt]);if(!a)continue;amt=type==='credit'?-a:a}
    out.push({d,desc:String(r[c.desc]||'').trim().replace(/\s+/g,' ')||'(no description)',amt:Math.round(amt*100)/100,bal:c.bal>=0?num(r[c.bal]):null});
  }
  return {rows:out,asc:out.length<2||out[0].d<=out[out.length-1].d,split};
}
const isDebt=t=>t==='credit'||t==='loan',eq2=(a,b)=>Math.abs(a-b)<.006;
/* Reads the balance column to tell a card file (balance rises with each charge) from a bank account file, and counts rows that do not add up. */
function fileKind(P){
  const R=P.asc?P.rows:[...P.rows].reverse(),F={kind:null,bad:0,open:null,close:null,first:R.length?R[0].d:null,last:R.length?R[R.length-1].d:null};
  if(!P.split||R.some(r=>r.bal==null))return F;
  let dep=0,cr=0,n=0;
  for(let i=1;i<R.length;i++){n++;if(eq2(R[i-1].bal+R[i].amt,R[i].bal))dep++;if(eq2(R[i-1].bal-R[i].amt,R[i].bal))cr++}
  if(!n||dep===cr)return F;
  F.kind=cr>dep?'credit':'deposit';F.bad=n-Math.max(dep,cr);
  F.open=Math.round((F.kind==='credit'?R[0].bal+R[0].amt:R[0].bal-R[0].amt)*100)/100;F.close=R[R.length-1].bal;
  return F;
}
/* Decides which account a file belongs to. sel is the account the user picked (or null for a new one of selType). */
function pickAccount(S,sel,selType,F,rows){
  const acc=S.accounts,have=new Set(S.tx.map(t=>t.id)),fits=id=>!F.kind||isDebt(acc[id].type)===(F.kind==='credit');
  const chains=id=>rows.some(r=>have.has([id,r.d,r.desc,r.amt,r.bal==null?'':r.bal,1].join('|')))||(F.kind&&acc[id].bal!=null&&acc[id].balDate&&acc[id].balDate<=F.first&&eq2(acc[id].bal,F.open)&&S.tx.some(t=>t.acct===id));
  const ch=Object.keys(acc).filter(id=>fits(id)&&chains(id));
  if(sel&&acc[sel]){
    if(ch.includes(sel)||(!ch.length&&fits(sel)))return {id:sel};
    if(ch.length===1)return {id:ch[0],moved:true};
    return fits(sel)?{id:sel}:{skip:true}}
  if(ch.length===1)return {id:ch[0],moved:true};
  let type=selType||'chequing',flipped=false;
  if(F.kind==='credit'&&!isDebt(type)){type='credit';flipped=true}else if(F.kind==='deposit'&&isDebt(type)){type='chequing';flipped=true}
  return {id:null,type,flipped};
}
/* Turns saved data from any earlier version into the current shape. Fields it does not know are kept as they are.
   Version 1 to 2 only adds: budgets, bought items, and three Setup fields (hourly pay, shift length, extra debt payment). */
function normalize(P){
  if(!P||typeof P!=='object'||!P.settings||typeof P.settings!=='object'||!Array.isArray(P.tx))return null;
  const D=DEF(),S={...D,...P,settings:{...D.settings,...P.settings}};
  for(const k of ['cash','wish','pend','bought'])if(!Array.isArray(S[k]))S[k]=[];
  for(const k of ['accounts','rules','seen','budgets'])if(!S[k]||typeof S[k]!=='object'||Array.isArray(S[k]))S[k]={};
  S.bought=S.bought.filter(b=>b&&b.name&&typeof b.bought==='string');
  S.tx=S.tx.filter(t=>t&&t.id&&typeof t.d==='string'&&typeof t.amt==='number'&&!isNaN(t.amt));
  S.v=2;return S;
}
const BACKUP_FORMAT=1;
function makeBackup(S,now){return JSON.stringify({app:'cashbook',format:BACKUP_FORMAT,exported:now,data:S})}
function readBackup(text){
  let B;try{B=JSON.parse(String(text).replace(/^﻿/,''))}catch(e){return {ok:false,why:'That file could not be read. It is not a Cashbook backup.'}}
  if(!B||B.app!=='cashbook'||!B.data)return {ok:false,why:'That file is not a Cashbook backup.'};
  if(B.format>BACKUP_FORMAT||(+B.data.v||1)>2)return {ok:false,why:'That backup was made by a newer Cashbook than this one, so it was left alone.'};
  const S=normalize(B.data);if(!S)return {ok:false,why:'That backup is damaged: its settings or transactions are missing.'};
  const ds=S.tx.map(t=>t.d).sort();
  return {ok:true,state:S,info:{exported:B.exported||null,tx:S.tx.length,cash:S.cash.length,wish:S.wish.length,accounts:Object.keys(S.accounts).length,from:ds[0]||null,to:ds[ds.length-1]||null}};
}

const mkCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c};

    if(p.d<=today&&CATS[c]!=='x')ev.push({d:p.d,amt:-p.amt,cat:c,desc:p.desc,key:mkey(p.desc),id:p.id,pend:1})}

    const r={...w,cool,waited,coolLeft,payDays:incDay>0?w.price/incDay:null,hours:hourly>0?w.price/hourly:null,ready};
    const viaDebt=!isNeed&&A.debtHi>0;
    if(viaDebt&&ready!==today){r.verdict='Card first';r.tone='warn';
      r.why=`You owe ${money0(A.debtHi)} at about ${pct(A.hiApr)}%, which costs roughly ${money0(A.intM)} a month. Putting ${money0(w.price)} toward that balance is a guaranteed ${pct(A.hiApr)}% return. Nothing on this list beats that.`;
      r.lesson=ready?`Stay on this pace and it is yours around ${dshort(ready)}, paid in cash. On the card it would add about ${money(w.price*A.hiApr/1200)} in interest every month it sits there.`:`At your current pace the balance is not shrinking, so this has no date yet. Use the trim slider to find one.`}
    else if(ready===today){
      if(coolLeft>0){r.verdict=`Wait ${coolLeft} day${coolLeft>1?'s':''}`;r.tone='info';r.ready=addDays(today,coolLeft);
        r.why=`You can afford it today, but it has only been on the list for ${waited} day${waited===1?'':'s'}.`;
        r.lesson=`Wants at this price get a ${cool}-day pause. If you still want it on ${dshort(r.ready)}, it is a real want and not an impulse.`}

        r.why=viaDebt?`You have enough cash to clear the ${money0(A.debtHi)} high-interest balance first and still pay for this, with your ${money0(buf)} buffer untouched.`:`You have ${money0(avail-before)} free for it after your ${money0(buf)} buffer and the bills due before payday${isNeed?'':`, and you have sat on it for ${waited} days`}.`;
        r.lesson=(viaDebt?'Pay the card before you buy. ':'')+(r.hours?`It costs ${hrs(r.hours)} of your work. `:r.payDays?`It costs ${r.payDays.toFixed(1)} days of take-home pay. `:'')+'If that trade still feels right, buy it and mark it bought.'}}
    else if(ready){const short=before+w.price-avail,weeks=Math.max(1,diff(ready,today)/7);r.verdict='Save for it';r.tone='info';
      if(ready<addDays(today,coolLeft))r.ready=addDays(today,coolLeft);
      r.why=`You are ${money0(short)} short${before>0?' once the items ahead of it are covered':''}. Your surplus runs about ${money0(Sx)} a month.`;
      r.lesson=`Set aside ${money0(short/weeks)} a week and you can pay cash around ${dshort(ready)}. No borrowing, no interest.`}
    else{r.verdict=isNeed?'Needs a plan':'Not now';r.tone='crit';
      r.why=`You spend ${money0(-Sx)} a month more than you bring in, so no money is on its way to fund this.`;
      r.lesson=top?`Your largest flexible category is ${top[0]} at ${money0(top[1])} in the last 30 days. Trim it until the surplus turns positive and this gets a date.`:'Get income above spending first. Then this gets a date.'}
    return r};
  for(const w of needs){items.push(judge(w,when(cum+w.price),cum));cum+=w.price}
  if(A.debtHi>0&&wants.length){cum+=A.debtHi;debtRow={name:'High-interest debt cleared',amt:A.debtHi,ready:when(cum)}}
  for(const w of wants){items.push(judge(w,when(cum+w.price),cum));cum+=w.price}
  return {items,debtRow,surplus:Sx,avail};
}

/* ---------- debt payoff ---------- */
const rate2=n=>String(+(+n).toFixed(2));
const hrs=h=>h<1?Math.max(1,Math.round(h*60))+' minutes':(+h.toFixed(1)===1?'1 hour':(+h.toFixed(1))+' hours');
const monthName=m=>dfmt(m+'-01',{month:'long',year:'numeric'});
/* Month by month: interest is added, each debt gets its minimum (or just its interest when no minimum is entered),
   then the extra goes to one debt at a time. Minimums freed by a cleared debt roll on to the next one. */
function payoff(debts,extra,first,today){
  const D=debts.map(d=>({...d,b:d.bal,int:0,done:null})),order=[...D].sort((a,b)=>first==='small'?a.b-b.b||b.apr-a.apr:b.apr-a.apr||a.b-b.b);
  const y0=+today.slice(0,4),m0=+today.slice(5,7),when=k=>{const t=m0-1+k;return (y0+Math.floor(t/12))+'-'+pad(t%12+1)};
  let m=0,total=0;
  while(D.some(d=>d.b>.005)&&m<600){m++;let pool=extra;
    for(const d of D){if(d.b<=.005)continue;const i=d.b*d.apr/1200;d.b+=i;d.int+=i;total+=i;d.b-=Math.min(d.b,d.min>0?d.min:i)}
    for(const d of D)if(d.done&&d.done<m&&d.min>0)pool+=d.min;
    for(const d of order){if(pool<=.005)break;if(d.b<=.005)continue;const p=Math.min(pool,d.b);d.b-=p;pool-=p}
    for(const d of D)if(d.b<=.005&&!d.done)d.done=m}
  const ok=D.every(d=>d.done);
  return {months:ok?m:null,when:ok?when(m):null,interest:total,first:order.length?order[0].id:null,
    debts:D.map(d=>({id:d.id,name:d.name,months:d.done,when:d.done?when(d.done):null,interest:d.int}))};
}
function debtPlan(A,extra){
  const D=A.debts||[],t=A.today;if(!D.length)return null;
  const rate=payoff(D,extra,'rate',t),small=payoff(D,extra,'small',t),bySmall=small.months!=null&&(rate.months==null||small.interest<rate.interest-.5);
  const plan=bySmall?small:rate,other=bySmall?rate:small,steps=[...new Set([0,25,50,100,200,extra])].sort((a,b)=>a-b);
  return {plan,order:bySmall?'small':'rate',saves:plan.months!=null&&other.months!=null?other.interest-plan.interest:0,
    choices:steps.map(x=>{const p=payoff(D,x,bySmall?'small':'rate',t);return {extra:x,months:p.months,when:p.when,interest:p.interest}}),
    noMin:D.filter(d=>!(d.min>0)).map(d=>d.name)};
}

/* ---------- budgets ---------- */
function budgetAverages(A){
  const f=A.full.slice(-3),avg={};
  for(const r of f)for(const c in r.cat)if(CATS[c]==='flex'||CATS[c]==='fixed')avg[c]=(avg[c]||0)+r.cat[c]/f.length;
  for(const c in avg){avg[c]=Math.round(avg[c]);if(avg[c]<1)delete avg[c]}
  return {n:f.length,avg};
}
function budgetStatus(S,A){
  const t=A.today,cm=ym(t),day=+t.slice(8),dim=new Date(Date.UTC(+cm.slice(0,4),+cm.slice(5),0)).getUTCDate(),left=dim-day,mon=A.months.find(r=>r.m===cm)||{cat:{}},rows=[],f=A.full.slice(-3),fm=new Set(f.map(r=>r.m)),later={};
  /* What usually still comes after this day of the month, from your own last full months. Handles bills that land in lumps. */
  for(const e of A.ev)if(e.cat!=='Income'&&fm.has(ym(e.d))&&+e.d.slice(8)>day)later[e.cat]=(later[e.cat]||0)-e.amt/f.length;
  for(const c in S.budgets||{}){const b=+S.budgets[c];if(!(b>0))continue;
    const spent=Math.max(0,mon.cat[c]||0),proj=f.length?spent+Math.max(0,later[c]||0):CATS[c]==='flex'?spent/day*dim:spent,room=b-spent;let tone='good',note;
    if(spent>b+.005){tone='crit';note=`Over by ${money0(spent-b)}${left?` with ${left} day${left===1?'':'s'} left`:''}.`}
    else if(proj>b*1.05&&(day>=5||spent>=b*.5)){tone='warn';note=`On pace for ${money0(proj)}, which is ${money0(proj-b)} over.${left?` ${money0(room/left)} a day keeps you inside.`:''}`}
    else note=`${money0(room)} left${left?`, about ${money0(room/left)} a day`:''}.`;
    rows.push({cat:c,budget:b,spent,proj,tone,note,pct:Math.min(1,spent/b),mark:day/dim})}
  return rows.sort((a,b)=>b.spent/b.budget-a.spent/a.budget);
}

/* ---------- bought items and what they taught ---------- */
const dueReviews=(S,today)=>(S.bought||[]).filter(b=>!b.worth&&diff(today,b.bought)>=30);
function lessons(S){
  const R=(S.bought||[]).filter(b=>b.worth),yes=R.filter(b=>b.worth==='yes'),no=R.filter(b=>b.worth==='no'),out=[];
  if(!R.length)return out;
  const wait=b=>Math.max(0,diff(b.bought,b.added||b.bought)),cost=L=>money0(sum(L.map(b=>+b.price||0)));
  out.push(`Worth it: ${yes.length} of ${R.length}.${no.length?` Not worth it: ${no.length}, costing ${cost(no)}.`:''}`);
  if(yes.length&&no.length){const a=median(no.map(wait)),b=median(yes.map(wait));
    if(a<b)out.push(`The ones you regret sat on the list for ${a} day${a===1?'':'s'} before you bought them. The ones worth it sat for ${b}.`)}
  const early=no.filter(b=>b.verdict&&b.verdict!=='Buy it');
  if(early.length)out.push(`${early.length} of the ${no.length} you regret ${early.length===1?'was':'were'} bought before the verdict said "Buy it".`);
  const wants=no.filter(b=>b.need<=2);
  if(wants.length)out.push(`${wants.length} of the ${no.length} you regret ${wants.length===1?'was':'were'} rated "${NEED[1]}" or "${NEED[2]}".`);
  const hard=yes.filter(b=>b.need>=4);
  if(hard.length&&hard.length===yes.length&&no.length)out.push('Everything that was worth it was something you rated as a need.');
  return out;
}

/* ---------- weekly review ---------- */
function weekly(S,A){
  const t=A.today,a0=addDays(t,-7),b0=addDays(t,-14),within=(e,lo,hi)=>e.d>lo&&e.d<=hi;
  const tot=(lo,hi,inc)=>sum(A.ev.filter(e=>within(e,lo,hi)&&(e.cat==='Income')===inc).map(e=>inc?e.amt:-e.amt));
  const W={from:addDays(a0,1),to:t,changes:[],leaks:[],actions:[],empty:!A.ev.some(e=>within(e,a0,t))};
  if(W.empty)return W;
  const sp=tot(a0,t,false),sp0=tot(b0,a0,false),inc=tot(a0,t,true),inc0=tot(b0,a0,true),prior=A.ev.some(e=>within(e,b0,a0));
  W.changes.push({title:`You spent ${money0(sp)}`,body:!prior?'There is no earlier week to compare with yet.':Math.round(sp)===Math.round(sp0)?`The same as the week before.`:`${money0(Math.abs(Math.round(sp)-Math.round(sp0)))} ${sp>sp0?'more':'less'} than the week before (${money0(sp0)}).`,tone:prior&&sp>sp0+1?'warn':'good'});
  W.changes.push({title:`${money0(inc)} came in`,body:prior?`${money0(inc0)} came in the week before.`:'There is no earlier week to compare with yet.',tone:'info'});
  const H=history(A,7),dn=Math.round(A.net)-Math.round(H[0].y);
  W.changes.push({k:'net',title:`Net position ${dn>=0?'rose':'fell'} ${money0(Math.abs(dn))}`,body:`It was ${money0(H[0].y)} a week ago and is ${money0(A.net)} today.`,tone:dn>=0?'good':'warn'});
  const cats={};
  for(const e of A.ev){if(e.cat==='Income'||e.cat==='Rent')continue;const i=within(e,a0,t)?0:within(e,b0,a0)?1:-1;if(i<0)continue;(cats[e.cat]||(cats[e.cat]=[0,0]))[i]-=e.amt}
  let up=null;for(const c in cats){const d=cats[c][0]-cats[c][1];if(prior&&d>=10&&(!up||d>up.d))up={c,d,a:cats[c][0],b:cats[c][1]}}
  if(up)W.changes.push({title:`${up.c} went up ${money0(Math.round(up.a)-Math.round(up.b))}`,body:`${money0(up.a)} this week against ${money0(up.b)} the week before.`,tone:'warn'});
  const g={};
  for(const e of A.ev){if(!within(e,a0,t)||e.amt>=0||!(TRIM.has(e.cat)||e.cat==='Fees & interest'))continue;
    const k=e.cat+'|'+e.key,r=g[k]||(g[k]={cat:e.cat,name:e.cat==='Untracked cash'?'Cash with no record':isETF(String(e.desc).toUpperCase())?'e-Transfers you sent':pretty(e.desc),amt:0,n:0});r.amt-=e.amt;r.n++}
  W.leaks=Object.values(g).filter(r=>r.amt>=1).sort((a,b)=>b.amt-a.amt||(a.name<b.name?-1:1)).slice(0,3);
  W.actions=insights(S,A).filter(i=>i.sev!=='good'&&i.act).slice(0,3).map(i=>({title:i.title,act:i.act}));
  return W;
}

/* ---------- one-handed logging ---------- */
/* Amount typing: digits, one decimal point, two decimals at most. */
const amtText=s=>{s=String(s).replace(/,/g,'.').replace(/[^0-9.]/g,'');const i=s.indexOf('.'),whole=w=>w.replace(/^0+(?=\d)/,'').slice(0,6);
  return i<0?whole(s):(whole(s.slice(0,i))||'0')+'.'+s.slice(i+1).replace(/\./g,'').slice(0,2)};
const padKey=(v,k)=>k==='back'?String(v).slice(0,-1):amtText(String(v)+k);
/* The places you pay most often, for one-tap logging. Built only from your own last 90 days. */
function quickPlaces(A,n){
  const from=addDays(A.today,-90),g={};
  for(const e of A.ev){if(e.d<=from||e.amt>=0||CATS[e.cat]!=='flex'||e.cat==='Untracked cash'||e.cat==='Fees & interest'||e.cat==='Subscriptions'||isETF(String(e.desc).toUpperCase()))continue;
    const name=e.cash||e.pend?String(e.desc).trim():pretty(e.desc);if(!name||name==='Cash'||name==='Card payment'||name==='Unknown')continue;

  return Object.values(g).sort((a,b)=>b.n-a.n||(a.last<b.last?1:a.last>b.last?-1:0)||(a.name<b.name?-1:1)).slice(0,n||6).map(r=>r.name);

/* ---------- charts as tables ---------- */
/* A line chart as rows: one every `step` days counted from today, plus the last day. alt is a second projected line, or null. */
function chartRows(hist,pr,alt,step){
  const t=pr[0].d,last=pr[pr.length-1].d,am=alt?new Map(alt.map(p=>[p.d,p.y])):null,rows=[];
  for(const p of hist)if(p.d<t&&diff(t,p.d)%step===0)rows.push({d:p.d,kind:'Actual',y:p.y});
  for(const p of pr)if(diff(p.d,t)%step===0||p.d===last)rows.push({d:p.d,kind:p.d===t?'Today':'Projected',y:p.y,lo:p.d===t||p.lo==null?null:p.lo,hi:p.d===t||p.hi==null?null:p.hi,alt:am&&p.d>t&&am.has(p.d)?am.get(p.d):null});

}

/* ---------- Ask: what Claude is told ---------- */
const ADVISOR_RULES=`You are the money helper inside Cashbook, a personal budgeting page. The person lives in Canada and is asking about their own money. The DATA section below is built from their Cashbook: bank imports, cash they logged, their settings and the page's own forecast.

const ask={st:'idle',turns:[],live:'',err:'',off:'',ctl:null,fn:undefined};
const ASK_OUTSIDE='Ask uses your Claude account to answer, so it works only when this page is open inside Claude. Everything else on this page works here.';
async function getSample(){
  if(ask.fn!==undefined)return ask.fn;
  if(!(window.claude&&window.claude.use)){ask.fn=null;ask.off=ASK_OUTSIDE;return null}
  try{ask.fn=await window.claude.use('sample')}catch(e){ask.fn=null}
  if(!ask.fn)ask.off='Claude is not available to this page right now, so Ask cannot answer.';
  return ask.fn;
}
/* Turns Claude's reply into safe HTML: paragraphs, "- " lists, numbered lists and **bold**. Everything else is plain text. */
function fmtAnswer(t){
  const out=[],inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');let list=null,para=[];
  const endP=()=>{if(para.length)out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[]};
  const endL=()=>{if(list)out.push(`<${list.t}>${list.i.map(x=>'<li>'+inl(x)+'</li>').join('')}</${list.t}>`);list=null};
  for(const raw of String(t).replace(/\r/g,'').split('\n')){const l=raw.replace(/^#+\s+/,'').trimEnd(),m=l.match(/^\s*([-*•]|\d+[.)])\s+(.*)$/);
    if(!l.trim()){endP();endL();continue}
    if(m){endP();const tp=/\d/.test(m[1])?'ol':'ul';if(list&&list.t!==tp)endL();(list||(list={t:tp,i:[]})).i.push(m[2])}
    else{endL();para.push(l)}}
  endP();endL();return out.join('');
}

async function askSend(text){

  ask.turns.push({role:'user',content:text});ask.err='';ask.live='';ask.st='busy';const ctl=ask.ctl=new AbortController();render();
  const scrollEnd=()=>{const c=q('#chat');if(c&&c.lastElementChild)c.lastElementChild.scrollIntoView({block:'nearest'})};scrollEnd();
  const fn=await getSample();
  if(!fn){ask.st='idle';render();return}
  const input=[{role:'user',content:advisorPrompt(S,A,demo)},...ask.turns.slice(-16)];
  try{
    const r=await fn(input,{cache:false,signal:ctl.signal,onText:({text})=>{ask.live=text;const el=q('#ask-live');if(el)el.innerHTML=fmtAnswer(text)}});
    ask.turns.push({role:'assistant',content:r.text,cut:!!r.truncated});say('Claude answered: '+r.text.slice(0,600));
  }catch(e){const c=e&&e.code;
    if(e&&e.text&&c!=='refused')ask.turns.push({role:'assistant',content:e.text,cut:c==='cancelled'?'stopped':true});
    if(c==='cancelled'){}

    else ask.err=ASK_FAIL[c]||'Something went wrong reaching Claude. Try again.';
    if(ask.err||ask.off)say(ask.err||ask.off)}
  finally{if(ask.ctl===ctl){ask.ctl=null;ask.st='idle';ask.live=''}
    if(ui.view==='ask'){render();scrollEnd()}}
}
